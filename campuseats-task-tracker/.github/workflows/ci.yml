name: CI Pipeline

on:
  push:
    branches: [ main, feature/task-tracker ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install dependencies
      run: npm install
      working-directory: SE3090_Lecture04_Demo/src/LankaMart.Api

    - name: Run build / test
      run: npm test || echo "No tests configured, skipping"
      working-directory: SE3090_Lecture04_Demo/src/LankaMart.Api